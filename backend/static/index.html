<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>44 interprètes — Tapis</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0a0510;color:#f8efff;font-family:Georgia,'Palatino Linotype',serif;min-height:100vh;overflow-x:hidden}.ambient{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 30% 20%,#4c1d6040,transparent 50%),radial-gradient(ellipse at 70% 80%,#78283c33,transparent 50%),radial-gradient(ellipse at 50% 50%,#140a23,#060309)}.app{display:grid;grid-template-columns:minmax(930px,1fr) 360px;gap:18px;max-width:1330px;margin:auto;padding:18px}.table-wrap{perspective:1400px;overflow:auto;padding:10px}.table{position:relative;width:930px;height:820px;border-radius:24px;transform:rotateX(8deg);transform-style:preserve-3d;background:radial-gradient(ellipse at center,#2a1a3e,#1f1235 30%,#150a24 60%,#0d061a);border:3px solid #6b4c8a;box-shadow:0 0 0 6px #1a0e2e,0 0 0 8px #8b6ab0,0 0 60px #6b4c8a66,0 30px 80px #000c,inset 0 0 100px #0009}.sigil{position:absolute;top:50%;left:50%;width:500px;height:500px;transform:translate(-50%,-50%);border:1px solid #b48cdc14;border-radius:50%;pointer-events:none}.sigil:before,.sigil:after{content:"";position:absolute;inset:60px;border:1px solid #b48cdc10;border-radius:50%}.sigil:after{inset:120px}.card{position:absolute;width:80px;height:112px;transform-style:preserve-3d;will-change:transform}.inner{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;overflow:hidden}.back{background:linear-gradient(135deg,#5a1830,#7a2040 30%,#5a1830 60%,#3d1020);border:2px solid #c9a84c;box-shadow:inset 0 0 15px #0009}.back:before{content:'✦';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:26px;color:#c9a84c88}.back:after{content:"";position:absolute;inset:5px;border:1px solid #c9a84c33;background:repeating-linear-gradient(45deg,transparent 0 6px,#c9a84c14 6px 7px),repeating-linear-gradient(-45deg,transparent 0 6px,#c9a84c14 6px 7px)}.front{transform:rotateY(180deg);background:linear-gradient(135deg,#fdf6e3,#f4e8c8 50%,#ede0b8);border:1px solid #c9a84c;box-shadow:inset 0 0 20px #b48c501a;color:#1a1a2e}.value{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px;font-weight:bold;text-align:center}.corner{position:absolute;font-size:11px;font-weight:bold;line-height:1.1;text-align:center}.tl{top:5px;left:6px}.br{bottom:5px;right:6px;transform:rotate(180deg)}.suit{display:block;font-size:13px}.clickable{cursor:pointer}.clickable:hover{filter:brightness(1.25) drop-shadow(0 0 12px #c9a84c80)}.deck:before,.deck:after{content:"";position:absolute;inset:0;border-radius:8px;background:linear-gradient(135deg,#5a1830,#7a2040 30%,#5a1830 60%,#3d1020);border:2px solid #c9a84c}.deck:before{transform:translate(3px,3px) translateZ(-2px);opacity:.7}.deck:after{transform:translate(6px,6px) translateZ(-4px);opacity:.5}.deck .inner{z-index:1}.panel{background:#1e122be8;border:1px solid #573b6e;border-radius:18px;padding:18px;min-height:780px;display:flex;flex-direction:column}.panel h1{font-size:30px;color:#f5d891}.panel h2{margin:18px 0 10px}.muted{font:13px system-ui;color:#b9aec4;line-height:1.5}.status{min-height:25px;color:#d6ad62;font:13px system-ui}.messages{overflow:auto;flex:1;min-height:260px}.msg{white-space:pre-wrap;line-height:1.45;padding:12px;margin:9px 0;border-radius:13px}.user{background:#563a70;margin-left:22px}.oracle{background:#291a38;margin-right:12px}.form{display:flex;gap:7px;margin-top:10px}.form input{min-width:0;flex:1;padding:11px;border:1px solid #6b4c83;border-radius:9px;background:#100a19;color:#fff;font:inherit}.btn{padding:10px 13px;border:1px solid #d6ad62;border-radius:9px;background:#3a2050;color:#fff;cursor:pointer;font:inherit}.btn:disabled{opacity:.45}.revealed{font:13px system-ui;max-height:150px;overflow:auto}.revealed div{padding:6px;border-left:2px solid #d6ad62}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:1350px){.app{grid-template-columns:1fr}.panel{min-height:0;max-width:930px;margin:auto;width:100%}.table-wrap{max-width:950px;margin:auto}}@media(max-width:600px){.app{padding:6px}.table-wrap{transform:scale(.72);transform-origin:top left;width:690px;height:600px;margin-bottom:-200px}}
</style></head>
<body><div class="ambient"></div><main class="app"><section><div class="table-wrap"><div id="table" class="table"><div class="sigil"></div><div id="cards"></div></div></div></section><aside class="panel"><h1>44 interprètes</h1><p class="muted">Consultation symbolique anonyme</p><p class="muted">Les cartes proposent des symboles, elles ne remplacent pas un avis médical, juridique, financier ou professionnel.</p><div id="status" class="status">Préparation du tapis…</div><h2>Oracle</h2><div id="messages" class="messages"></div><div class="form"><input id="input" maxlength="4000" placeholder="Écris à l’oracle…"><button class="btn" id="send">➤</button></div><h2>Cartes révélées</h2><div id="revealed" class="revealed">Aucune carte révélée.</div><div class="actions"><button class="btn" id="export">Exporter</button><button class="btn" id="new">Nouveau tirage</button></div></aside></main>
<script>
const TOP=['B1','C1','D1','E1','F1','G1','H1'], POS={A1:[40,40]};for(const c of TOP)POS[c]=[{B:160,C:260,D:360,E:460,F:560,G:660,H:760}[c[0]],40];for(const c of 'ABCDE')for(let r=2;r<=12;r++)POS[c+r]=[{A:40,B:160,C:260,D:360,E:460}[c],200+(r-2)*32];let sid=null,busy=false,previous={};const $=x=>document.getElementById(x);function setStatus(t){$('status').textContent=t}async function api(path,opt={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json();if(!r.ok)throw Error(d.detail||'Erreur serveur');return d}function cardFront(c){let code=c.code||'',rank=code.slice(0,-1),s=code.slice(-1),sym={C:'♣',D:'♦',H:'♥',S:'♠'}[s]||'';let red=s==='D'||s==='H';return `<div class="corner tl" style="color:${red?'#c41e3a':'#1a1a2e'}">${rank}<span class="suit">${sym}</span></div><div class="value" style="color:${red?'#c41e3a':'#1a1a2e'}">${sym}</div><div class="corner br" style="color:${red?'#c41e3a':'#1a1a2e'}">${rank}<span class="suit">${sym}</span></div>`}function animate(el,from,to,face,delay){let inn=el.querySelector('.inner'),a=from||POS.A1,b=to||POS.A1;el.style.transform=`translate3d(${a[0]}px,${a[1]}px,0)`;inn.style.transform=face?'rotateY(0deg)':'rotateY(180deg)';void el.offsetHeight;let midX=(a[0]+b[0])/2,midY=Math.min(a[1],b[1])-70;el.animate([{transform:`translate3d(${a[0]}px,${a[1]}px,0)`},{transform:`translate3d(${midX}px,${midY}px,140px)`,offset:.5},{transform:`translate3d(${b[0]}px,${b[1]}px,0)`}],{duration:850,delay,easing:'cubic-bezier(.25,.46,.45,.94)',fill:'forwards'});if(face)inn.animate([{transform:'rotateY(0deg)',offset:0},{transform:'rotateY(0deg)',offset:.35},{transform:'rotateY(180deg)',offset:1}],{duration:850,delay,easing:'cubic-bezier(.25,.46,.45,.94)',fill:'forwards'})}function add(role,text){let d=document.createElement('div');d.className='msg '+(role==='user'?'user':'oracle');d.textContent=text;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}function render(s){let cards=s.cards||[],now={};$('cards').innerHTML='';let deck=document.createElement('div');deck.className='card deck';deck.style.zIndex=0;deck.innerHTML='<div class="inner"><div class="face back"></div><div class="face front"></div></div>';deck.style.transform=`translate3d(${POS.A1[0]}px,${POS.A1[1]}px,0)`;$('cards').appendChild(deck);cards.forEach((c,i)=>{let p=POS[c.slot]||POS.A1,el=document.createElement('div');el.className='card '+(c.face==='down'?'clickable':'');el.dataset.slot=c.slot;el.style.zIndex=(c.slot==='A1'?0:(parseInt(c.slot.slice(1))||1));el.innerHTML=`<div class="inner"><div class="face back"></div><div class="face front">${cardFront(c)}</div></div>`;$('cards').appendChild(el);let old=previous[c.code];if(old)animate(el,POS[old.slot]||POS.A1,p,c.face==='up',80+i*45);else animate(el,POS.A1,p,c.face==='up',100+i*70);now[c.code]={slot:c.slot,face:c.face};if(c.face==='down')el.onclick=()=>reveal(c.slot)});previous=now;let up=cards.filter(c=>c.face==='up');$('revealed').innerHTML=up.length?up.map(c=>`<div><b>${c.name||c.code}</b> (${c.code}) — ${c.slot}<br>${c.symbol||''}</div>`).join(''):'Aucune carte révélée.';if(s.messages?.length){$('messages').innerHTML='';s.messages.forEach(m=>add(m.role,m.content))}}async function start(){busy=true;setStatus('Préparation du tapis…');try{let d=await api('/api/sessions',{method:'POST',body:'{}'});sid=d.session_id;previous={};$('messages').innerHTML='';render(d.state);setStatus('Le tapis est prêt.')}catch(e){setStatus(e.message)}finally{busy=false}}async function reveal(slot){if(busy)return;busy=true;setStatus('La carte rejoint la colonne active…');try{let s=await api(`/api/sessions/${sid}/cards/reveal`,{method:'POST',body:JSON.stringify({slot})});render(s);setStatus('Lecture reçue.')}catch(e){setStatus(e.message)}finally{busy=false}}async function send(){let i=$('input'),text=i.value.trim();if(!text||busy)return;i.value='';add('user',text);busy=true;setStatus('L’oracle consulte le contexte…');try{let d=await api(`/api/sessions/${sid}/messages`,{method:'POST',body:JSON.stringify({message:text})});add('oracle',d.content);setStatus('Réponse reçue.')}catch(e){add('oracle',e.message);setStatus('Erreur de consultation')}finally{busy=false}}$('send').onclick=send;$('input').onkeydown=e=>{if(e.key==='Enter')send()};$('new').onclick=start;$('export').onclick=()=>sid&&(location.href=`/api/sessions/${sid}/export`);start();
</script></body></html>
