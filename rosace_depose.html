<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>44i — Dépose rosace {13/4}</title>
  <style>
    :root {
      --felt: #1a0e24;
      --ink: #0a0510;
      --gold: #c9a84c;
      --gold-dim: rgba(201, 168, 76, 0.28);
      --cream: #f6edd4;
      --red: #b41c32;
      --black: #1a1a2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--ink);
      color: #e8d5a3;
      font-family: Georgia, "Palatino Linotype", serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    body.oracle {
      height: 100vh;
      overflow: hidden;
    }
    .ambient {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse at 30% 18%, rgba(76, 29, 96, .28), transparent 52%),
        radial-gradient(ellipse at 72% 82%, rgba(120, 40, 60, .18), transparent 50%),
        radial-gradient(ellipse at 50% 50%, #140a22, #060309);
    }
    header {
      position: relative; z-index: 3;
      width: min(960px, 100%);
      padding: 16px 20px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      align-items: baseline;
      justify-content: space-between;
    }
    h1 {
      font-size: 18px;
      font-weight: normal;
      letter-spacing: .08em;
      color: var(--gold);
    }
    h1 span { opacity: .55; font-size: 13px; letter-spacing: .04em; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button {
      background: transparent;
      border: 1px solid #6b4c8a;
      color: var(--gold);
      font-family: inherit;
      font-size: 13px;
      letter-spacing: .06em;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--gold); background: rgba(201,168,76,.08); }
    button:disabled { opacity: .4; cursor: default; }
    .meta { font-size: 12px; color: #9a8150; letter-spacing: .04em; }
    .stage-wrap {
      position: relative; z-index: 2;
      width: min(960px, 100vw);
      height: min(960px, 100vw);
      flex: 0 0 auto;
      transition: height .95s cubic-bezier(.22, .8, .2, 1);
    }
    body.oracle .stage-wrap {
      height: 0;
      overflow: hidden;
      pointer-events: none;
    }
    body.oracle header { padding: 8px 16px 0; }
    body.oracle header h1 span { display: none; }
    #hand-rail {
      position: relative;
      z-index: 4;
      width: min(960px, 100%);
      height: 0;
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
      pointer-events: none;
    }
    body.oracle #hand-rail {
      height: 168px;
      pointer-events: auto;
    }
    #hand-rail .card {
      position: relative;
      left: auto;
      top: auto;
      width: 39px;
      height: 56px;
      flex: 0 0 39px;
      margin: 0 -10px;
    }
    #stage {
      position: absolute; inset: 18px;
      border-radius: 24px;
      background:
        radial-gradient(ellipse at center, #2a1840 0%, #1a0e28 42%, #100818 100%);
      border: 3px solid #6b4c8a;
      box-shadow:
        0 0 0 6px #1a0e2e,
        0 0 0 7px #8b6ab0,
        0 24px 70px rgba(0,0,0,.65),
        inset 0 0 90px rgba(0,0,0,.45);
      overflow: hidden;
      transition:
        background .7s ease,
        border-color .7s ease,
        box-shadow .7s ease,
        inset .7s ease;
    }
    body.oracle #stage {
      inset: 0;
      background: transparent;
      border-color: transparent;
      box-shadow: none;
      overflow: visible;
    }
    body.oracle #rosace,
    body.oracle .burst,
    body.oracle #deck-heart {
      opacity: 0;
      pointer-events: none;
      transition: opacity .45s ease;
    }
    #stage.dealing,
    #stage.recalling { cursor: default; }
    #stage.dealing .card,
    #stage.recalling .card { pointer-events: none; }
    #rosace {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    #deck-heart {
      position: absolute;
      left: 50%; top: 50%;
      width: 48px; height: 68px;
      transform: translate(-50%, -50%) scale(0.72);
      border-radius: 6px;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(135deg, #5a1830 0%, #7a2040 32%, #3d1020 100%);
      border: 2px solid var(--gold);
      box-shadow:
        3px 3px 0 #4a1224,
        6px 6px 0 #3a0e1c,
        0 0 24px rgba(201,168,76,.25);
      z-index: 2;
      transition: opacity .22s ease, transform .22s ease;
    }
    #deck-heart.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    #deck-heart::after {
      content: "✦";
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: rgba(201,168,76,.55);
    }
    .burst {
      position: absolute;
      left: 50%; top: 50%;
      width: 12px; height: 12px;
      margin: -6px 0 0 -6px;
      border: 1px solid rgba(201,168,76,.0);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }
    #stage.dealing .burst {
      animation: burst 4.4s cubic-bezier(.15,.8,.2,1) both;
    }
    #stage.recalling .burst {
      animation: unburst 3.2s cubic-bezier(.2,.15,.2,1) both;
    }
    @keyframes burst {
      0%   { width: 12px; height: 12px; margin: -6px 0 0 -6px; border-color: rgba(201,168,76,.55); opacity: .8; }
      35%  { opacity: .25; }
      100% { width: 780px; height: 780px; margin: -390px 0 0 -390px; border-color: rgba(201,168,76,0); opacity: 0; }
    }
    @keyframes unburst {
      0%   { width: 780px; height: 780px; margin: -390px 0 0 -390px; border-color: rgba(201,168,76,.35); opacity: .35; }
      100% { width: 12px; height: 12px; margin: -6px 0 0 -6px; border-color: rgba(201,168,76,0); opacity: 0; }
    }
    .card {
      position: absolute;
      width: 34.5px; height: 49.5px;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
      transform-style: preserve-3d;
      cursor: pointer;
      transition: filter .2s ease;
      will-change: left, top, transform, opacity;
    }
    #stage:not(.dealing):not(.recalling) .card:not(.in-hand):hover {
      filter: brightness(1.18) drop-shadow(0 0 10px rgba(201,168,76,.55));
      z-index: 400 !important;
    }
    .card.in-hand {
      cursor: default;
      filter: drop-shadow(0 10px 16px rgba(0,0,0,.45));
    }
    .card-inner {
      position: absolute; inset: 0;
      transform-style: preserve-3d;
      transition: transform .55s cubic-bezier(.2,.7,.2,1);
    }
    .card.revealed .card-inner { transform: rotateY(180deg); }
    .face {
      position: absolute; inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 6px;
      overflow: hidden;
    }
    .back {
      background: linear-gradient(135deg, #5a1830 0%, #7a2040 32%, #5a1830 62%, #3d1020 100%);
      border: 2px solid var(--gold);
      box-shadow: inset 0 0 0 1px rgba(201,168,76,.28), inset 0 0 12px rgba(0,0,0,.55);
    }
    .back::before {
      content: "";
      position: absolute; inset: 4px;
      border: 1px solid rgba(201,168,76,.22);
      border-radius: 3px;
      background-image:
        repeating-linear-gradient(45deg, transparent 0 5px, rgba(201,168,76,.09) 5px 6px),
        repeating-linear-gradient(-45deg, transparent 0 5px, rgba(201,168,76,.09) 5px 6px);
    }
    .back::after {
      content: "✦";
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: rgba(201,168,76,.55);
      font-size: 16px;
    }
    .front {
      background: linear-gradient(160deg, #fdf6e3, #f0e2b8);
      border: 1px solid #c9a84c;
      transform: rotateY(180deg);
      color: var(--black);
    }
    .front.red { color: var(--red); }
    .front .corner {
      position: absolute;
      font-size: 10px; font-weight: bold; line-height: 1.05;
      text-align: center;
    }
    .front .corner.tl { top: 3px; left: 4px; }
    .front .corner.br { bottom: 3px; right: 4px; transform: rotate(180deg); }
    .front .pip {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 22px;
    }
    footer {
      position: relative; z-index: 3;
      width: min(960px, 100%);
      padding: 8px 20px 20px;
    }
    body.oracle footer { display: none; }
    #revealed {
      min-height: 1.4em;
      font-size: 14px;
      color: var(--cream);
      letter-spacing: .03em;
    }
    #revealed em { color: #9a8150; font-style: normal; }
    #chat-panel {
      display: none;
      position: relative;
      z-index: 3;
      width: min(960px, 100%);
      flex: 1;
      min-height: 0;
      flex-direction: column;
      margin: 0 12px 16px;
      background: linear-gradient(180deg, rgba(26,14,40,.55), rgba(10,6,18,.82));
      border: 1px solid #4a2a6e;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,.35);
    }
    body.oracle #chat-panel {
      display: flex;
      animation: chatIn .55s .15s ease both;
    }
    @keyframes chatIn {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: none; }
    }
    #chat-log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 18px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bubble {
      max-width: 82%;
      padding: 10px 13px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.45;
    }
    .bubble.oracle {
      align-self: flex-start;
      background: rgba(107, 76, 138, .28);
      border: 1px solid rgba(201,168,76,.22);
      color: var(--cream);
    }
    .bubble.user {
      align-self: flex-end;
      background: rgba(201,168,76,.12);
      border: 1px solid rgba(201,168,76,.35);
      color: #f3e6b8;
    }
    #chat-form {
      display: flex;
      gap: 8px;
      padding: 10px 12px 12px;
      border-top: 1px solid #2a1a3e;
    }
    #chat-input {
      flex: 1;
      padding: 12px 14px;
      background: #1a0e2e;
      border: 1px solid #4a2a6e;
      border-radius: 8px;
      color: #e8d5a3;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }
    #chat-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 10px rgba(201,168,76,.18);
    }
    #chat-send {
      width: 46px; height: 46px;
      border-radius: 50%;
      padding: 0;
    }
  </style>
</head>
<body>
  <div class="ambient"></div>
  <header>
    <h1>Dépose rosace {13/4} <span>13 pointes · 39 intersections · 52 cartes</span></h1>
    <div class="toolbar">
      <span class="meta" id="seed-label"></span>
      <button type="button" id="btn-shuffle">Nouvelle donne</button>
      <button type="button" id="btn-hide">Recacher</button>
    </div>
  </header>
  <div id="hand-rail" aria-label="Main de trois cartes"></div>
  <div class="stage-wrap">
    <div id="stage">
      <svg id="rosace" viewBox="0 0 1000 1000" aria-hidden="true"></svg>
      <div class="burst"></div>
      <div id="deck-heart"></div>
    </div>
  </div>
  <section id="chat-panel" aria-label="Fenêtre de l'oracle">
    <div id="chat-log"></div>
    <form id="chat-form" autocomplete="off">
      <input id="chat-input" type="text" placeholder="Pose ta question aux trois cartes…" maxlength="500">
      <button type="submit" id="chat-send" title="Envoyer">✦</button>
    </form>
  </section>
  <footer>
    <div id="revealed"><em>Clique une carte pour la révéler.</em></div>
  </footer>

<script>
(function () {
  const N = 13, K = 4, CX = 500, CY = 500, R = 392;
  const DEAL_MS = 4400;
  const STAGGER_MS = 1680;
  const FLIGHT_MS = DEAL_MS - STAGGER_MS;
  const RECALL_STAGGER = 1200;
  const RECALL_FLIGHT = 2000;
  const HAND_MS = 1600;
  const HAND_SLOTS = [
    { left: "45.2%", top: "74%", rot: -11, z: 260 },
    { left: "50.0%", top: "73%", rot: 2, z: 261 },
    { left: "54.8%", top: "74%", rot: 12, z: 262 }
  ];
  const ORACLE_SLOTS = [
    { left: "41.5%", top: "54%", rot: -10, z: 260 },
    { left: "50.0%", top: "48%", rot: 2, z: 261 },
    { left: "58.5%", top: "54%", rot: 12, z: 262 }
  ];
  const UNVEIL_MS = 900;
  const RANKS = ["A","2","3","4","5","6","7","8","9","T","J","Q","K"];
  const SUITS = [
    { id: "S", pip: "♠", red: false, name: "pique" },
    { id: "H", pip: "♥", red: true,  name: "cœur" },
    { id: "D", pip: "♦", red: true,  name: "carreau" },
    { id: "C", pip: "♣", red: false, name: "trèfle" }
  ];
  const RANK_FACE = { A:"A", T:"10", J:"V", Q:"D", K:"R" };

  function vertex(i) {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / N;
    return { x: Math.cos(a), y: Math.sin(a) };
  }

  function intersect(a, b, c, d) {
    const den = (a.x - b.x) * (c.y - d.y) - (a.y - b.y) * (c.x - d.x);
    if (Math.abs(den) < 1e-12) return null;
    const t = ((a.x - c.x) * (c.y - d.y) - (a.y - c.y) * (c.x - d.x)) / den;
    const u = ((a.x - c.x) * (a.y - b.y) - (a.y - c.y) * (a.x - b.x)) / den;
    if (t > 1e-8 && t < 1 - 1e-8 && u > 1e-8 && u < 1 - 1e-8) {
      return { x: a.x + t * (b.x - a.x), y: a.y + t * (b.y - a.y) };
    }
    return null;
  }

  function sitesUnit() {
    const V = [];
    for (let i = 0; i < N; i++) V.push(vertex(i));
    const tips = V.map((p, i) => ({
      id: i, kind: "tip", ux: p.x, uy: p.y
    }));
    const crosses = [];
    for (let i = 0; i < N; i++) {
      for (let j = i + 1; j < N; j++) {
        const ei = new Set([i, (i + K) % N]);
        const ej = new Set([j, (j + K) % N]);
        let share = false;
        ei.forEach((v) => { if (ej.has(v)) share = true; });
        if (share) continue;
        const p = intersect(V[i], V[(i + K) % N], V[j], V[(j + K) % N]);
        if (p) {
          crosses.push({
            id: tips.length + crosses.length,
            kind: "cross",
            ux: p.x, uy: p.y,
            edges: [i, j]
          });
        }
      }
    }
    return tips.concat(crosses);
  }

  function toCanvas(sites) {
    return sites.map(function (s) {
      const r = Math.hypot(s.ux, s.uy);
      const angle = Math.atan2(s.uy, s.ux);
      /* Les croisements internes sont tirés vers le centre
         pour sortir de sous les cartes plus externes. Les pointes restent. */
      const pull = (r < 0.92 && r > 1e-6) ? Math.pow(r, 0.88) : 1;
      return Object.assign({}, s, {
        x: CX + R * s.ux * pull,
        y: CY + R * s.uy * pull,
        radius: r,
        angle: angle
      });
    });
  }

  function fullDeck() {
    const deck = [];
    SUITS.forEach((suit) => {
      RANKS.forEach((rank) => deck.push({
        code: rank + suit.id,
        rank, suit: suit.id, pip: suit.pip, red: suit.red,
        label: (RANK_FACE[rank] || rank) + suit.pip
      }));
    });
    return deck;
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function shuffle(arr, rnd) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function drawMat(sites) {
    const svg = document.getElementById("rosace");
    const tips = sites.filter((s) => s.kind === "tip");
    let dPoly = "";
    tips.forEach((s, i) => { dPoly += (i ? " L " : "M ") + s.x.toFixed(2) + " " + s.y.toFixed(2); });
    dPoly += " Z";
    let dStar = "";
    for (let k = 0; k < N; k++) {
      const a = tips[k], b = tips[(k + K) % N];
      dStar += "M " + a.x.toFixed(2) + " " + a.y.toFixed(2) + " L " + b.x.toFixed(2) + " " + b.y.toFixed(2) + " ";
    }
    svg.innerHTML = [
      '<circle cx="500" cy="500" r="392" fill="none" stroke="rgba(201,168,76,0.14)" stroke-width="1"/>',
      '<circle cx="500" cy="500" r="228" fill="none" stroke="rgba(201,168,76,0.07)" stroke-width="1"/>',
      '<path d="' + dPoly + '" fill="none" stroke="rgba(201,168,76,0.08)" stroke-width="1"/>',
      '<path d="' + dStar + '" fill="none" stroke="rgba(201,168,76,0.05)" stroke-width="1"/>'
    ].join("");
  }

  const SITES = toCanvas(sitesUnit());
  const stage = document.getElementById("stage");
  const heart = document.getElementById("deck-heart");
  const btnShuffle = document.getElementById("btn-shuffle");
  const btnHide = document.getElementById("btn-hide");
  let seed = 0;
  let placements = [];
  let chosen = [];
  let phase = "table";
  let dealing = false;
  let dealTimer = 0;
  let dealId = 0;
  const running = [];

  function stopAnims() {
    running.splice(0).forEach(function (a) { try { a.cancel(); } catch (e) {} });
    if (dealTimer) {
      clearTimeout(dealTimer);
      dealTimer = 0;
    }
  }

  function replayBurst() {
    const burst = stage.querySelector(".burst");
    if (!burst) return;
    const clone = burst.cloneNode(true);
    burst.parentNode.replaceChild(clone, burst);
  }

  function dealOrder() {
    return placements
      .map(function (p, idx) { return { idx: idx, r: p.site.radius, a: p.site.angle }; })
      .sort(function (u, v) { return u.r - v.r || u.a - v.a; })
      .map(function (o) { return o.idx; });
  }

  function recallOrder() {
    return placements
      .map(function (p, idx) { return { idx: idx, r: p.site.radius, a: p.site.angle }; })
      .sort(function (u, v) { return v.r - u.r || u.a - v.a; })
      .map(function (o) { return o.idx; })
      .filter(function (idx) { return chosen.indexOf(idx) === -1; });
  }

  function stackByDeal() {
    dealOrder().forEach(function (idx, rank) {
      const el = stage.querySelector('.card[data-idx="' + idx + '"]');
      if (!el) return;
      const z = 30 + rank;
      el.style.zIndex = String(z);
      el.dataset.z = String(z);
    });
  }

  function makeCard(p, idx) {
    const rot = ((p.site.id * 17) % 13) - 6;
    const el = document.createElement("div");
    el.className = "card" + (p.revealed ? " revealed" : "");
    el.style.left = "50%";
    el.style.top = "50%";
    el.style.setProperty("--rot", rot + "deg");
    el.dataset.idx = String(idx);
    el.dataset.rot = String(rot);
    el.dataset.tx = (p.site.x / 10).toFixed(4) + "%";
    el.dataset.ty = (p.site.y / 10).toFixed(4) + "%";
    el.title = p.revealed ? p.card.label : "Face cachée";
    el.innerHTML =
      '<div class="card-inner">' +
        '<div class="face back"></div>' +
        '<div class="face front' + (p.card.red ? " red" : "") + '">' +
          '<div class="corner tl">' + (RANK_FACE[p.card.rank] || p.card.rank) + "<br>" + p.card.pip + "</div>" +
          '<div class="pip">' + p.card.pip + "</div>" +
          '<div class="corner br">' + (RANK_FACE[p.card.rank] || p.card.rank) + "<br>" + p.card.pip + "</div>" +
        "</div>" +
      "</div>";
    el.addEventListener("click", function () {
      if (dealing || phase !== "table") return;
      if (p.revealed) {
        p.revealed = false;
        el.classList.remove("revealed");
        chosen = chosen.filter(function (i) { return i !== idx; });
        el.title = "Face cachée";
        updateList();
        return;
      }
      p.revealed = true;
      el.classList.add("revealed");
      chosen.push(idx);
      el.title = p.card.label;
      updateList();
      if (chosen.length >= 3) gatherToHand();
    });
    return el;
  }

  function throwDeal() {
    stopAnims();
    dealing = true;
    phase = "table";
    const thisDeal = ++dealId;
    stage.classList.add("dealing");
    stage.classList.remove("recalling", "hand");
    btnShuffle.disabled = true;
    btnHide.disabled = true;
    heart.classList.add("visible");
    replayBurst();

    const order = dealOrder();
    const n = Math.max(order.length - 1, 1);

    order.forEach(function (idx, rank) {
      const el = stage.querySelector('.card[data-idx="' + idx + '"]');
      if (!el) return;
      const tx = el.dataset.tx;
      const ty = el.dataset.ty;
      const rot = Number(el.dataset.rot);
      const spin = (rank % 2 ? -1 : 1) * (110 + (rank * 11) % 70);
      const delay = (rank / n) * STAGGER_MS;

      const anim = el.animate([
        {
          offset: 0,
          left: "50%",
          top: "50%",
          transform: "translate(-50%, -50%) rotate(" + spin + "deg) scale(0.86)"
        },
        {
          offset: 0.88,
          left: tx,
          top: ty,
          transform: "translate(-50%, -54%) rotate(" + (rot * 0.55) + "deg) scale(1.05)"
        },
        {
          offset: 1,
          left: tx,
          top: ty,
          transform: "translate(-50%, -50%) rotate(" + rot + "deg) scale(1)"
        }
      ], {
        duration: FLIGHT_MS,
        delay: delay,
        easing: "cubic-bezier(0.14, 0.82, 0.18, 1)",
        fill: "forwards"
      });
      running.push(anim);
    });

    document.getElementById("revealed").innerHTML = "<em>Lancé — les cartes trouvent leurs sites…</em>";

    dealTimer = setTimeout(function () {
      heart.classList.remove("visible");
    }, STAGGER_MS);

    Promise.all(running.map(function (a) { return a.finished.catch(function () {}); })).then(function () {
      if (thisDeal !== dealId) return;
      dealing = false;
      stage.classList.remove("dealing");
      heart.classList.remove("visible");
      btnShuffle.disabled = false;
      btnHide.disabled = false;
      stage.querySelectorAll(".card").forEach(function (el) {
        el.style.left = el.dataset.tx;
        el.style.top = el.dataset.ty;
        el.style.transform = "translate(-50%, -50%) rotate(" + el.dataset.rot + "deg)";
      });
      running.length = 0;
      updateList();
    });
  }

  function gatherToHand() {
    if (phase !== "table") return;
    phase = "recalling";
    dealing = true;
    const thisDeal = ++dealId;
    stopAnims();
    stage.classList.add("recalling");
    btnShuffle.disabled = true;
    btnHide.disabled = true;
    replayBurst();

    const keep = chosen.slice(0, 3);
    const returning = recallOrder();
    const n = Math.max(returning.length - 1, 1);

    keep.forEach(function (idx, i) {
      const el = stage.querySelector('.card[data-idx="' + idx + '"]');
      const slot = HAND_SLOTS[i];
      if (!el || !slot) return;
      el.classList.add("in-hand", "revealed");
      const fromRot = Number(el.dataset.rot);
      const anim = el.animate([
        {
          offset: 0,
          left: el.dataset.tx,
          top: el.dataset.ty,
          transform: "translate(-50%, -50%) rotate(" + fromRot + "deg) scale(1)"
        },
        {
          offset: 0.55,
          left: slot.left,
          top: slot.top,
          transform: "translate(-50%, -58%) rotate(" + (slot.rot * 0.4) + "deg) scale(1.42)"
        },
        {
          offset: 1,
          left: slot.left,
          top: slot.top,
          transform: "translate(-50%, -50%) rotate(" + slot.rot + "deg) scale(1.52)"
        }
      ], {
        duration: HAND_MS,
        delay: i * 70,
        easing: "cubic-bezier(0.16, 0.84, 0.18, 1)",
        fill: "forwards"
      });
      el.style.zIndex = String(slot.z);
      running.push(anim);
    });

    returning.forEach(function (idx, rank) {
      const el = stage.querySelector('.card[data-idx="' + idx + '"]');
      if (!el) return;
      const rot = Number(el.dataset.rot);
      const spin = (rank % 2 ? 1 : -1) * (100 + (rank * 9) % 70);
      const delay = (rank / n) * RECALL_STAGGER;
      const anim = el.animate([
        {
          offset: 0,
          left: el.dataset.tx,
          top: el.dataset.ty,
          opacity: 1,
          transform: "translate(-50%, -50%) rotate(" + rot + "deg) scale(1)"
        },
        {
          offset: 0.84,
          left: "50%",
          top: "50%",
          opacity: 1,
          transform: "translate(-50%, -50%) rotate(" + spin + "deg) scale(0.88)"
        },
        {
          offset: 1,
          left: "50%",
          top: "50%",
          opacity: 0,
          transform: "translate(-50%, -50%) rotate(" + spin + "deg) scale(0.55)"
        }
      ], {
        duration: RECALL_FLIGHT,
        delay: delay,
        easing: "cubic-bezier(0.18, 0.12, 0.2, 1)",
        fill: "forwards"
      });
      running.push(anim);
    });

    document.getElementById("revealed").innerHTML = "<em>Rappel — la main se forme, le reste rentre…</em>";

    dealTimer = setTimeout(function () {
      heart.classList.add("visible");
    }, Math.round(RECALL_FLIGHT * 0.72));

    Promise.all(running.map(function (a) { return a.finished.catch(function () {}); })).then(function () {
      if (thisDeal !== dealId) return;
      heart.classList.remove("visible");
      returning.forEach(function (idx) {
        const el = stage.querySelector('.card[data-idx="' + idx + '"]');
        if (el) el.remove();
      });
      keep.forEach(function (idx, i) {
        const el = stage.querySelector('.card[data-idx="' + idx + '"]');
        const slot = HAND_SLOTS[i];
        if (!el || !slot) return;
        el.style.left = slot.left;
        el.style.top = slot.top;
        el.style.transform = "translate(-50%, -50%) rotate(" + slot.rot + "deg) scale(1.52)";
        el.style.zIndex = String(slot.z);
      });
      running.length = 0;
      stage.classList.remove("recalling");
      stage.classList.add("hand");
      unveilOracle(keep, thisDeal);
    });
  }

  function unveilOracle(keep, thisDeal) {
    phase = "oracle";
    heart.classList.remove("visible");
    const rail = document.getElementById("hand-rail");

    const first = keep.map(function (idx, i) {
      const el = stage.querySelector('.card[data-idx="' + idx + '"]');
      if (!el) return null;
      el.getAnimations().forEach(function (a) { try { a.cancel(); } catch (e) {} });
      return { el: el, rect: el.getBoundingClientRect(), rot: HAND_SLOTS[i].rot };
    }).filter(Boolean);

    first.forEach(function (item, i) {
      const slot = ORACLE_SLOTS[i];
      item.el.style.left = "auto";
      item.el.style.top = "auto";
      item.el.style.transform = "rotate(" + slot.rot + "deg) scale(2.15)";
      item.el.style.zIndex = String(slot.z);
      rail.appendChild(item.el);
    });

    document.body.classList.add("oracle");
    void rail.offsetWidth;

    first.forEach(function (item, i) {
      const slot = ORACLE_SLOTS[i];
      const last = item.el.getBoundingClientRect();
      const dx = item.rect.left - last.left;
      const dy = item.rect.top - last.top;
      const anim = item.el.animate([
        { transform: "translate(" + dx + "px," + dy + "px) rotate(" + item.rot + "deg) scale(1.52)" },
        { transform: "rotate(" + slot.rot + "deg) scale(2.15)" }
      ], {
        duration: UNVEIL_MS,
        delay: i * 40,
        easing: "cubic-bezier(0.2, 0.8, 0.18, 1)",
        fill: "forwards"
      });
      running.push(anim);
    });

    Promise.all(running.map(function (a) { return a.finished.catch(function () {}); })).then(function () {
      if (thisDeal !== dealId) return;
      first.forEach(function (item, i) {
        const slot = ORACLE_SLOTS[i];
        item.el.style.transform = "rotate(" + slot.rot + "deg) scale(2.15)";
      });
      running.length = 0;
      dealing = false;
      btnShuffle.disabled = false;
      btnHide.disabled = true;
      updateList();
      openChat();
    });
  }

  function openChat() {
    const log = document.getElementById("chat-log");
    log.innerHTML = "";
    appendBubble("oracle", "Trois cartes. Une question.");
    const input = document.getElementById("chat-input");
    if (input) input.focus();
  }

  function appendBubble(who, text) {
    const log = document.getElementById("chat-log");
    const el = document.createElement("div");
    el.className = "bubble " + who;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  function deal(nextSeed) {
    seed = nextSeed >>> 0;
    if (!seed) seed = (Math.random() * 0xffffffff) >>> 0;
    const rnd = mulberry32(seed);
    const deck = shuffle(fullDeck(), rnd);
    if (SITES.length !== 52) {
      console.error("Sites:", SITES.length, "attendu 52");
    }
    chosen = [];
    phase = "table";
    document.body.classList.remove("oracle");
    document.getElementById("hand-rail").innerHTML = "";
    document.getElementById("chat-log").innerHTML = "";
    placements = SITES.map(function (site, i) {
      return { site: site, card: deck[i], revealed: false };
    });
    document.getElementById("seed-label").textContent = "seed " + seed + " · " + SITES.length + " sites · 4,4 s";
    render(true);
  }

  function render(withThrow) {
    stopAnims();
    document.getElementById("hand-rail").innerHTML = "";
    stage.querySelectorAll(".card").forEach(function (el) { el.remove(); });
    stage.classList.remove("hand", "recalling");
    drawMat(SITES);
    placements.forEach(function (p, idx) {
      stage.appendChild(makeCard(p, idx));
    });
    stackByDeal();
    if (withThrow) {
      throwDeal();
    } else {
      stage.querySelectorAll(".card").forEach(function (el) {
        el.style.left = el.dataset.tx;
        el.style.top = el.dataset.ty;
        el.style.transform = "translate(-50%, -50%) rotate(" + el.dataset.rot + "deg)";
      });
      dealing = false;
      phase = "table";
      stage.classList.remove("dealing", "recalling", "hand");
      heart.classList.remove("visible");
      btnShuffle.disabled = false;
      btnHide.disabled = false;
      updateList();
    }
  }

  function updateList() {
    const box = document.getElementById("revealed");
    const labels = chosen.map(function (idx) { return placements[idx].card.label; });
    if (phase === "hand" || phase === "oracle") {
      box.textContent = "Main — " + labels.join("   ");
      return;
    }
    if (!labels.length) {
      box.innerHTML = "<em>Clique une carte pour la révéler.</em>";
    } else if (labels.length < 3) {
      box.textContent = labels.length + " / 3 — " + labels.join("   ");
    } else {
      box.textContent = labels.join("   ");
    }
  }

  btnShuffle.addEventListener("click", function () {
    if (dealing) return;
    deal((Math.random() * 0xffffffff) >>> 0);
  });
  btnHide.addEventListener("click", function () {
    if (dealing || phase !== "table") return;
    chosen = [];
    placements.forEach(function (p) { p.revealed = false; });
    render(false);
  });
  document.getElementById("chat-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (phase !== "oracle") return;
    const input = document.getElementById("chat-input");
    const text = (input.value || "").trim();
    if (!text) return;
    appendBubble("user", text);
    input.value = "";
  });

  deal((Math.random() * 0xffffffff) >>> 0);
})();
</script>
</body>
</html>
